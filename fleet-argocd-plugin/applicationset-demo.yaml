apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applicationset-demo
  namespace: argocd
spec:
    generators:
    - plugin:
        configMapRef:
          name: argocd-fleet-sync
        input:
          parameters:
            fleetProjectNumber: "$FLEET_PROJECT_NUMBER"
            scopeID: "$TEAM_ID"
        requeueAfterSeconds: 10
    syncPolicy:
      # IMPORTANT: Use create-update to prevent app deletion when Fleet API returns partial data
      applicationsSync: create-update
      # Preserve K8s resources even if Application is deleted
      preserveResourcesOnDeletion: true
    template:
      metadata:
        name: '{{name}}-webserver'
      spec:
        destination:
          namespace: webserver
          server: '{{server}}'
        project: default
        source:
          path: guestbook
          repoURL: https://github.com/argoproj/argocd-example-apps.git
          targetRevision: HEAD
